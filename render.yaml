services:
  - type: web
    name: tama-live-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TAMA_ENV
        value: TESTNET
      - key: TAMA_EXECUTION
        value: LIVE_ORDERS
      - key: TAMA_CAPITAL_MODE
        value: EXCHANGE_DYNAMIC
      - key: BINANCE_TESTNET_KEY
        sync: false
      - key: BINANCE_TESTNET_SECRET
        sync: false
